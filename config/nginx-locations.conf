# 参考片段：upstream 放在 http 层（与 niuma_site 并列）；
# location 放入 www.niuma007.com 的 server { }（须写在 location / 之前）。
# 官网仓已合并进 niuma-site/config/conf.d/niuma-site.conf。
#
# /niuma/cloud（API） /niuma/ops（Admin）

upstream niuma_cloud {
    server 127.0.0.1:8090;
    keepalive 16;
}

location = /niuma {
    return 302 /niuma/ops/;
}

location /niuma/ {
    # 流水线上传 / 用户下载安装包（可达 2GB）
    client_max_body_size 2g;
    proxy_pass http://niuma_cloud;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
