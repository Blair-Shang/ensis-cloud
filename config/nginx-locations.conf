# 参考片段：limit_*_zone 必须放在 http { }；
# upstream 放在 http 层；location 放入 www.niuma007.com 的 server { }
#（须写在 location / 之前，且比 location /niuma/ 更具体）。
# 官网仓已合并进 niuma-site/config/conf.d/niuma-site.conf。
#
# /niuma/cloud（API） /niuma/ops（Admin）

upstream niuma_cloud {
    server 127.0.0.1:8090;
    keepalive 16;
}

# 放在 http { }：
# limit_req_zone  $binary_remote_addr zone=niuma_dl_latest:10m rate=8r/s;
# limit_conn_zone $binary_remote_addr zone=niuma_dl_conn:10m;

location = /niuma {
    return 302 /niuma/ops/;
}

# 解析 latest：限请求，防刷 302 / 打库。真实下包走 files，不要对 files 套 limit_req。
location = /niuma/cloud/api/v1/updates/download {
    limit_req zone=niuma_dl_latest burst=8 nodelay;
    client_max_body_size 1m;
    proxy_pass http://niuma_cloud;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 安装包：限并发与单连接速率，保留长超时与 Range。
location /niuma/cloud/api/v1/updates/files/ {
    limit_conn niuma_dl_conn 4;
    limit_rate 8m;
    client_max_body_size 1m;
    proxy_pass http://niuma_cloud;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

location /niuma/ {
    # 流水线上传 / 其余 API（可达 2GB）
    client_max_body_size 2g;
    proxy_pass http://niuma_cloud;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
